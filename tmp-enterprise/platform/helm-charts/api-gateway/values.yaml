# Default values for api-gateway chart

# Deployment configuration
replicaCount: 2

# Image configuration
image:
  repository: prima-api/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Environment variables
env:
  API_KEY: 
  USER_SERVICE_URL: http://user-service:8000
  AVATAR_SERVICE_URL: http://avatar-service:8000

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Kubernetes namespace
namespace: prima-api