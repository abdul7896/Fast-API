apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prima-api-networking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/Fast-API.git
    targetRevision: HEAD
    path: kubernetes/networking
  destination:
    server: https://kubernetes.default.svc
    namespace: prima-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true