name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.10.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name prima-api-cluster --region us-east-1

    - name: Deploy User Service
      run: |
        helm upgrade --install user-service \
          platform/helm-charts/user-service \
          --namespace prima-api \
          --create-namespace \
          --set image.tag=${{ github.sha }}

    - name: Deploy Avatar Service
      run: |
        helm upgrade --install avatar-service \
          platform/helm-charts/avatar-service \
          --namespace prima-api \
          --set image.tag=${{ github.sha }}

    - name: Deploy API Gateway
      run: |
        helm upgrade --install api-gateway \
          platform/helm-charts/api-gateway \
          --namespace prima-api \
          --set image.tag=${{ github.sha }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.10.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name prima-api-cluster --region us-east-1

    - name: Deploy User Service
      run: |
        helm upgrade --install user-service \
          platform/helm-charts/user-service \
          --namespace prima-api \
          --set image.tag=${{ github.sha }}

    - name: Deploy Avatar Service
      run: |
        helm upgrade --install avatar-service \
          platform/helm-charts/avatar-service \
          --namespace prima-api \
          --set image.tag=${{ github.sha }}

    - name: Deploy API Gateway
      run: |
        helm upgrade --install api-gateway \
          platform/helm-charts/api-gateway \
          --namespace prima-api \
          --set image.tag=${{ github.sha }}