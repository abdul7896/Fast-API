name: Helm Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'platform/helm-charts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'platform/helm-charts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [user-service, avatar-service, api-gateway]
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.10.0

    - name: Helm Lint
      run: |
        helm lint platform/helm-charts/${{ matrix.chart }}