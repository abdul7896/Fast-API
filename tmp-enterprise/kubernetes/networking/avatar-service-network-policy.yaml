apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: avatar-service-network-policy
  namespace: prima-api
spec:
  podSelector:
    matchLabels:
      app: avatar-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: s3  # This would be for actual S3 access
    ports:
    - protocol: TCP
      port: 443