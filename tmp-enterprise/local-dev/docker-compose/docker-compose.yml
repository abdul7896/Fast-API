version: '3.8'

services:
  # LocalStack for AWS services simulation
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - SERVICES=s3,dynamodb
      - DEFAULT_REGION=us-east-1
      - HOSTNAME_EXTERNAL=localstack
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - prima-network

  # User Service
  user-service:
    build:
      context: ../microservices/user-service
    container_name: user-service
    ports:
      - "8001:8000"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - DYNAMODB_TABLE=users
      - API_
    depends_on:
      - localstack
    networks:
      - prima-network

  # Avatar Service
  avatar-service:
    build:
      context: ../microservices/avatar-service
    container_name: avatar-service
    ports:
      - "8002:8000"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET=prima-avatars
      - DYNAMODB_TABLE=users
      - API_
    depends_on:
      - localstack
    networks:
      - prima-network

  # API Gateway
  api-gateway:
    build:
      context: ../microservices/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - API_
      - USER_SERVICE_URL=http://user-service:8000
      - AVATAR_SERVICE_URL=http://avatar-service:8000
    depends_on:
      - user-service
      - avatar-service
    networks:
      - prima-network

networks:
  prima-network:
    driver: bridge