# Default values for avatar-service chart

# Deployment configuration
replicaCount: 2

# Image configuration
image:
  repository: prima-api/avatar-service
  tag: latest
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8000

# Environment variables
env:
  AWS_REGION: us-east-1
  S3_BUCKET: prima-avatars
  DYNAMODB_TABLE: users
  API_KEY: 

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Kubernetes namespace
namespace: prima-api