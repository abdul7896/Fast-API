---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prima-api-config
  namespace: default
  labels:
    app: prima-api
data:
  AWS_REGION: "us-east-1"
  S3_BUCKET: "prima-api-avatars-production-12345678"
  DYNAMODB_TABLE: "prima-api-users-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: prima-api-secrets
  namespace: default
  labels:
    app: prima-api
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # echo -n "your-secret-api-key" | base64
  API_KEY: "eW91ci1zZWNyZXQtYXBpLWtleQ=="
