[project]
name = "prima-api"
version = "1.0.0"
description = "Production-ready FastAPI service with AWS integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "boto3>=1.34.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto>=4.2.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "bandit>=1.7.0"
]

[project.urls]
Homepage = "https://github.com/abdul7896/Fast-API"
Repository = "https://github.com/abdul7896/Fast-API.git"
Issues = "https://github.com/abdul7896/Fast-API/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

