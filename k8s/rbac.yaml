---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prima-api-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/prima-api-service-role-ENVIRONMENT"
  labels:
    app: prima-api
    version: "1.0.0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prima-api-cluster-role
  labels:
    app: prima-api
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prima-api-cluster-role-binding
  labels:
    app: prima-api
subjects:
- kind: ServiceAccount
  name: prima-api-service-account
  namespace: default
roleRef:
  kind: ClusterRole
  name: prima-api-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prima-api-role
  namespace: default
  labels:
    app: prima-api
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prima-api-role-binding
  namespace: default
  labels:
    app: prima-api
subjects:
- kind: ServiceAccount
  name: prima-api-service-account
  namespace: default
roleRef:
  kind: Role
  name: prima-api-role
  apiGroup: rbac.authorization.k8s.io
