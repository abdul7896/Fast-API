name: Kubernetes - Helm Validation

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [api-gateway, user-service, avatar-service, prima-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Helm Lint
        run: |
          helm lint kubernetes/helm/charts/${{ matrix.chart }}

  kubeconform:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubeconform
        run: |
          curl -L -O https://github.com/yannh/kubeconform/releases/download/v0.6.3/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform -summary kubernetes/manifests/

  notify:
    name: Send Kubernetes Notification
    runs-on: ubuntu-latest
    needs: [helm-lint, kubeconform]
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "⛵ Prima API Kubernetes Validation Status",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Prima API Kubernetes Validation Status"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ inputs.branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ inputs.commit_sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ job.status }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}