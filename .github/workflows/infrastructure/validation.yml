name: Infrastructure - Terraform Validation

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_REGION:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Format
        id: fmt
        run: |
          cd infrastructure/terraform
          terraform fmt -check

      - name: Terraform Init
        id: init
        run: |
          cd infrastructure/terraform
          terraform init

      - name: Terraform Validate
        id: validate
        run: |
          cd infrastructure/terraform
          terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          cd infrastructure/terraform
          terraform plan -no-color
        continue-on-error: true

  checkov-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.2831.0
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: sarif
          quiet: true
          soft_fail: false

  notify:
    name: Send Infrastructure Notification
    runs-on: ubuntu-latest
    needs: [terraform-validate, checkov-scan]
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🏗️ Prima API Infrastructure Validation Status",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Prima API Infrastructure Validation Status"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ inputs.branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ inputs.commit_sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ job.status }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}